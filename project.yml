name: XanhIOS
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  XanhIOS:
    type: application
    platform: iOS
    sources:
      - App
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        XANH_BLOCKER_MANIFEST_URL: https://lamppkk.github.io/xanh-ios/blocker/manifest-v1.json
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGN_ENTITLEMENTS: Config/XanhDebug.entitlements
          XANH_CLOUDKIT_ENABLED: NO
          XANH_BLOCKER_UPDATES_ENABLED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: Config/XanhRelease.entitlements
          XANH_CLOUDKIT_ENABLED: YES
          XANH_BLOCKER_UPDATES_ENABLED: YES
  XanhIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: XanhIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  XanhIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: XanhIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  XanhIOS:
    build:
      targets:
        XanhIOS: all
        XanhIOSTests: [test]
    test:
      targets:
        - XanhIOSTests
        - XanhIOSUITests
      environmentVariables:
        XANH_RULE_ARTIFACT_DIRECTORY: $(XANH_RULE_ARTIFACT_DIRECTORY)
        XANH_BLOCKER_MANIFEST: $(XANH_BLOCKER_MANIFEST)
        XANH_BLOCKER_ARTIFACT_DIRECTORY: $(XANH_BLOCKER_ARTIFACT_DIRECTORY)
        XANH_BLOCKER_PUBLIC_KEY_BASE64: $(XANH_BLOCKER_PUBLIC_KEY_BASE64)
        XANH_CAPTURE_MEDIA: $(XANH_CAPTURE_MEDIA)
