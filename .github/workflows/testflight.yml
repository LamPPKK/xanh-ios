name: testflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-upload:
    environment: testflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Enforce release preconditions
        env:
          CLOUDKIT_SCHEMA_PROMOTED: ${{ vars.CLOUDKIT_SCHEMA_PROMOTED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BLOCKER_PUBLIC_KEY_BASE64: ${{ secrets.BLOCKER_PUBLIC_KEY_BASE64 }}
        run: |
          python3 Tools/release_preflight.py
          printf '%s\n' "$BLOCKER_PUBLIC_KEY_BASE64" > Resources/blocker-public-key.txt
      - name: Configure App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - run: xcodegen generate
      - name: Test release tooling
        run: python3 -m unittest discover -s Tools/tests
      - name: Archive once
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project XanhIOS.xcodeproj \
            -scheme XanhIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XanhIOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean archive
      - name: Verify archived signature and entitlements
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$RUNNER_TEMP/XanhIOS.xcarchive/Products/Applications/XanhIOS.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/XanhIOS.entitlements.plist"
          python3 Tools/verify_entitlements.py \
            --plist "$RUNNER_TEMP/XanhIOS.entitlements.plist" \
            --team-id "$APPLE_TEAM_ID" \
            --bundle-id io.github.lamppkk.xanhbrowser.ios
      - name: Export the archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XanhIOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Test and validate exact IPA
        id: exact_ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BLOCKER_PUBLIC_KEY_BASE64: ${{ secrets.BLOCKER_PUBLIC_KEY_BASE64 }}
        run: |
          ipa="$(python3 Tools/release_evidence.py select-ipa --directory "$RUNNER_TEMP/export")"
          read -r expected_sha256 expected_size_bytes < <(
            python3 Tools/release_evidence.py identify-ipa --ipa "$ipa"
          )
          python3 Tools/verify_ipa.py \
            --ipa "$ipa" \
            --bundle-id io.github.lamppkk.xanhbrowser.ios \
            --version 0.1.0 \
            --build "${{ github.run_number }}" \
            --blocker-public-key-base64 "$BLOCKER_PUBLIC_KEY_BASE64"
          printf '%s  %s\n' "$expected_sha256" "$ipa" > "$RUNNER_TEMP/XanhIOS.ipa.sha256"
          xcrun altool --validate-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            printf 'path=%s\n' "$ipa"
            printf 'sha256=%s\n' "$expected_sha256"
            printf 'size_bytes=%s\n' "$expected_size_bytes"
          } >> "$GITHUB_OUTPUT"
      - name: Upload exact validated IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa="${{ steps.exact_ipa.outputs.path }}"
          shasum -a 256 --check "$RUNNER_TEMP/XanhIOS.ipa.sha256"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Record candidate evidence
        run: |
          python3 Tools/release_evidence.py create \
            --ipa "${{ steps.exact_ipa.outputs.path }}" \
            --output "$RUNNER_TEMP/release-evidence-v1.json" \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --build "${{ github.run_number }}" \
            --expected-sha256 "${{ steps.exact_ipa.outputs.sha256 }}" \
            --expected-size-bytes "${{ steps.exact_ipa.outputs.size_bytes }}"
          python3 Tools/release_evidence.py validate \
            --input "$RUNNER_TEMP/release-evidence-v1.json"
      - uses: actions/upload-artifact@v7
        with:
          name: Xanh-iOS-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/XanhIOS.xcarchive
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/XanhIOS.ipa.sha256
            ${{ runner.temp }}/XanhIOS.entitlements.plist
            ${{ runner.temp }}/release-evidence-v1.json
            Release/evidence-v1.schema.json
            Release/evidence-v1.corpus.json
            Release/evidence-v1.invariants.md
          retention-days: 14
      - name: Remove App Store Connect key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
