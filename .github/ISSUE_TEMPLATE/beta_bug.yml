name: TestFlight beta bug
description: Report a reproducible Xanh Browser beta problem without sensitive browsing data.
title: "[Beta] "
labels: [bug, testflight]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, authentication codes, cookies, private URLs, or sensitive screenshots.
  - type: input
    id: build
    attributes:
      label: Xanh version and build
      placeholder: 0.1.0 (42)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 16, iOS 18.6
    validations:
      required: true
  - type: dropdown
    id: space
    attributes:
      label: Browser context
      options:
        - Regular profile
        - Private space
        - Before a profile or space was visible
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public test URL if a page is needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, codes, cookies, private URLs, personal CloudKit records, and sensitive screenshots.
          required: true
